[project]
name = "patchwise"
version = "0.1.0"
description = "League of Legends patch analytics: a rate-limited crawler, a PostgreSQL warehouse and honest statistics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["patchwise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
